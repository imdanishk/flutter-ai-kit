name: validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - name: Repository checks
        run: dart tool/check.dart
      - name: Validate skills against the Agent Skills spec
        run: |
          pip install skills-ref==0.1.1
          for d in skills/*/; do agentskills validate "$d"; done
      - name: Shared core files analyze and test
        run: |
          d="$(mktemp -d)"
          mkdir "$d/lib" "$d/test"
          cp skills/flutter-new-project/assets/core/*.dart "$d/lib/"
          sed -i 's#package:flutter_bloc/flutter_bloc.dart#package:bloc/bloc.dart#' "$d/lib/cubit_ext.dart"
          cp tool/core_test/core_test.dart "$d/test/"
          printf '%s\n' 'name: core_check' 'environment:' "  sdk: '>=3.0.0'" 'dependencies:' '  bloc: any' 'dev_dependencies:' '  test: any' '  lints: any' > "$d/pubspec.yaml"
          printf '%s\n' 'include: package:lints/recommended.yaml' > "$d/analysis_options.yaml"
          cd "$d"
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: Fastlane version helper tests
        run: ruby tool/test_versioning.rb
      - name: Fastlane templates parse
        run: ruby -c skills/flutter-release/assets/fastlane/versioning.rb skills/flutter-release/assets/fastlane/android/Fastfile skills/flutter-release/assets/fastlane/ios/Fastfile
      - name: Installer smoke test
        run: |
          mkdir -p /tmp/app && echo "name: app" > /tmp/app/pubspec.yaml
          dart tool/install.dart --target /tmp/app --claude --copilot
          test -f /tmp/app/.agents/skills/flutter-feature/SKILL.md
          test -f /tmp/app/AGENTS.md
          dart tool/install.dart --target /tmp/app --claude --copilot
          test "$(grep -c 'flutter-ai-kit:start' /tmp/app/AGENTS.md)" = "1"
      - name: Installer refuses a broken marker and writes nothing
        run: |
          mkdir -p /tmp/bad && echo "name: bad" > /tmp/bad/pubspec.yaml
          printf '%s\n' 'my rules' '<!-- flutter-ai-kit:start v0 -->' 'half a block' > /tmp/bad/AGENTS.md
          cp /tmp/bad/AGENTS.md /tmp/bad.before
          if dart tool/install.dart --target /tmp/bad; then echo "installer should have failed"; exit 1; fi
          cmp /tmp/bad/AGENTS.md /tmp/bad.before
          test ! -d /tmp/bad/.agents
