name: release
# Publishes a GitHub release automatically when the version in
# .claude-plugin/plugin.json changes on main. No manual tagging needed.
on:
  push:
    branches: [main]
    paths: ['.claude-plugin/plugin.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  release:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - name: Read version
        id: v
        run: |
          VERSION="$(jq -r .version .claude-plugin/plugin.json)"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Bad version: $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Skip if this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then echo "done=true" >> "$GITHUB_OUTPUT"; else echo "done=false" >> "$GITHUB_OUTPUT"; fi
      - name: Check version, changelog and skills
        if: steps.exists.outputs.done == 'false'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: dart tool/check.dart --tag "v${VERSION}"
      - name: Build zip and notes
        if: steps.exists.outputs.done == 'false'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          git archive --format=zip --prefix="flutter-ai-kit-${VERSION}/" -o "flutter-ai-kit-${VERSION}.zip" HEAD
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
      - name: Publish release (creates the tag)
        if: steps.exists.outputs.done == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release create "v${VERSION}" "flutter-ai-kit-${VERSION}.zip" --target "${GITHUB_SHA}" --title "v${VERSION}" --notes-file notes.md
