name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Check version, changelog and skills
        run: dart tool/check.dart --tag "${GITHUB_REF_NAME}"
      - name: Build zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="flutter-ai-kit-${VERSION}/" -o "flutter-ai-kit-${VERSION}.zip" HEAD
      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "flutter-ai-kit-${GITHUB_REF_NAME#v}.zip" --title "${GITHUB_REF_NAME}" --notes-file notes.md
