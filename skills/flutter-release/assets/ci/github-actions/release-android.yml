# Starting point for .github/workflows/release-android.yml. NOT RUN against a real repository.
# Action tags (checkout v7, setup-java v6, flutter-action v2) were checked to exist on 2026-11-05; ruby/setup-ruby and the
# macOS/Ubuntu runner labels were not re-checked, and none of it was run: confirm current versions before using it.
# Secrets live in GitHub "Environments" named like your flavors (development, staging, production), each
# with the same secret names; required reviewers on the production environment gate production runs, and a
# deployment-branch rule limiting it to main stops a modified workflow on another branch from reading those
# secrets (environment protection rules: confirm in GitHub's docs). Production is manual-only: this workflow
# runs only when someone starts it.
name: Release Android

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Flutter flavor (must match an environment name)
        required: true
        type: choice
        options: [development, staging, production]
      destination:
        description: Where to upload
        required: true
        type: choice
        options: [firebase, playstore]
      track:
        description: Play track (playstore only)
        required: false
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      release:
        description: Version bump (none = build number only)
        required: false
        default: none
        type: choice
        options: [none, patch, minor, major]
      notes:
        description: Release notes
        required: false

permissions:
  contents: read

concurrency:
  group: release-android-${{ inputs.flavor }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.flavor }}
    defaults:
      run:
        working-directory: android
    env:
      FLUTTER_FLAVOR: ${{ inputs.flavor }}
      # Inputs go through env vars, never straight into the shell command (script injection).
      BUMP: ${{ inputs.release }}
      NOTES: ${{ inputs.notes }}
      TRACK: ${{ inputs.track }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"   # match your Gradle and AGP requirements

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # One version source: .fvmrc must hold an exact version, e.g. {"flutter": "3.35.0"},
          # not a channel name or a range.
          flutter-version-file: .fvmrc
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: android

      # Secrets are written to files only for this run. Names and paths must match what your Gradle
      # signing config and Fastfile read (see references/environments-and-signing.md).
      - name: Write signing and credential files
        env:
          ENV_FILE: ${{ secrets.FASTLANE_ENV_FILE }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$ENV_FILE" > "fastlane/.env.${FLUTTER_FLAVOR}"
          printf '%s' "$KEY_PROPERTIES" > key.properties
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "app/${FLUTTER_FLAVOR}-keystore.jks"
          printf '%s' "$PLAY_JSON" > fastlane/play-service-account.json
          printf '%s' "$FIREBASE_JSON" > fastlane/firebase-service-account.json
          # The env file must point GOOGLE_PLAY_JSON_KEY_FILE and FIREBASE_DISTRIBUTION_CREDENTIALS at these paths.

      - name: Dependencies and generated code
        working-directory: .
        run: |
          flutter pub get
          # Only if the project does not commit generated files:
          # dart run build_runner build

      - name: Analyze
        working-directory: .
        run: flutter analyze

      - name: Firebase App Distribution
        if: ${{ inputs.destination == 'firebase' }}
        run: bundle exec fastlane firebase release:"$BUMP" release_notes:"$NOTES"

      - name: Google Play
        if: ${{ inputs.destination == 'playstore' }}
        # The Play lane does not upload release notes (skip_upload_changelogs is on): write them in Play Console.
        run: bundle exec fastlane playstore track:"$TRACK" release:"$BUMP"
